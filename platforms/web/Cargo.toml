[package]
name    = "web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
voxel-app    = { workspace = true }
wasm-bindgen = "0.2"

# Both getrandom 0.2 (via rand 0.8) and 0.4 (via rand 0.10 / bevy) need js/wasm_js
# features to work on wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
